name: バグ報告
description: 不具合を報告する
title: '[bug] '
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        CAPTCHA / reCAPTCHA の回避に関する要望はお受けできません。
  - type: textarea
    id: what
    attributes:
      label: 起きたこと
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期待した動作
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 再現手順
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: バージョン
      placeholder: 0.1.0
  - type: dropdown
    id: os
    attributes:
      label: OS
      options: [macOS, Windows, Linux]
